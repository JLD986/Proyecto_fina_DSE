<div class="container-fluid">
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">📦 Producto Inventario</span>
    <button class="btn btn-outline-light btn-sm">Cerrar sesión</button>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Lista de productos</h4>
      <button class="btn btn-primary" (click)="abrirModal()">+ Agregar producto</button>
    </div>

    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Stock</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of productos; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.categoria }}</td>
          <td>{{ p.stock }}</td>
          <td>{{ p.precio }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-1" (click)="editarProducto(i)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminarProducto(i)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal fade show d-block" style="background:rgba(0,0,0,0.5)" *ngIf="mostrarModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ modoEdicion ? 'Editar producto' : 'Agregar producto' }}</h5>
          <button class="btn-close" (click)="cerrarModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" [(ngModel)]="productoActual.nombre">
          </div>
          <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input type="text" class="form-control" [(ngModel)]="productoActual.categoria">
          </div>
          <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" [(ngModel)]="productoActual.stock">
          </div>
          <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="text" class="form-control" [(ngModel)]="productoActual.precio">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
          <button class="btn btn-primary" (click)="guardarProducto()">Guardar</button>
        </div>
      </div>
    </div>
  </div>
</div>
