<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-dark">
  <div class="card p-4 shadow" style="width: 380px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold">📦 Producto Inventario</h2>
      <p class="text-muted">Inicia sesión para continuar</p>
    </div>
    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input type="email" class="form-control" [(ngModel)]="email" placeholder="Ingresa tu correo">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="password" placeholder="Ingresa tu contraseña">
    </div>
    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
    <button class="btn btn-primary w-100" (click)="iniciarSesion()">Iniciar sesión</button>
  </div>
</div>
